name: CI and Docker Publish

on:
  pull_request:
    branches: [master, staging]
  push:
    branches: [master, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.0.0"

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint API
        run: pnpm lint:api

      - name: Test API
        run: pnpm --filter @ansei/api exec jest --runInBand --passWithNoTests

      - name: Build API
        run: pnpm build:api

      - name: Lint web
        run: pnpm lint:web

      - name: Build web
        run: pnpm build:web

  publish-single:
    name: Publish Single App Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: metadata
        run: |
          echo "environment=${{ github.ref_name == 'master' && 'production' || 'staging' }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push single app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/vuteq/ansei-single-app:${{ steps.metadata.outputs.sha_tag }}
            docker.io/vuteq/ansei-single-app:${{ steps.metadata.outputs.environment }}
          cache-from: type=gha,scope=ansei-single-app
          cache-to: type=gha,mode=max,scope=ansei-single-app
          build-args: |
            API_URL=${{ secrets.API_URL }}
            NEXT_PUBLIC_SSO_URL=${{ secrets.NEXT_PUBLIC_SSO_URL }}
            NEXT_PUBLIC_CALLBACK_AUTH_URL=${{ secrets.NEXT_PUBLIC_CALLBACK_AUTH_URL }}
