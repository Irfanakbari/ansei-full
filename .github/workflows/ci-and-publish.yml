name: CI and Docker Publish

on:
  pull_request:
    branches: [master, staging]
  push:
    branches: [master, staging]

permissions:
  contents: read

concurrency:
  group: ansei-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.0.0"
  IMAGE_NAME: ansei-app

jobs:
  validate:
    name: Validate ANSEI workspace
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:phase3-disposable-only@127.0.0.1:56835/ansei_phase3
      NODE_OPTIONS: --experimental-vm-modules
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: phase3-disposable-only
          POSTGRES_DB: ansei_phase3
        ports: ["56835:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6385:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Prepare disposable integration database
        run: pnpm --filter @ansei/api exec prisma migrate deploy

      - name: Verify integration concurrency and recovery on PostgreSQL and Redis
        env:
          PHASE3_DATABASE_TEST: "1"
        run: |
          pnpm --filter @ansei/api exec jest src/common/outbox/phase-three.database.spec.ts --runInBand --forceExit

      - name: Verify retained browser command identities
        run: pnpm --filter @ansei/web exec node scripts/test-command-identity.mjs

      - name: Lint API
        run: pnpm lint:api

      - name: Test API
        run: pnpm --filter @ansei/api exec jest --runInBand --forceExit

      - name: Build API
        run: pnpm build:api

      - name: Lint web
        run: pnpm lint:web

      - name: Build web
        run: pnpm build:web
        env:
          API_URL: ${{ vars.API_URL || secrets.API_URL }}
          NEXT_PUBLIC_SSO_URL: ${{ vars.NEXT_PUBLIC_SSO_URL || secrets.NEXT_PUBLIC_SSO_URL }}
          NEXT_PUBLIC_CALLBACK_AUTH_URL: ${{ vars.NEXT_PUBLIC_CALLBACK_AUTH_URL || secrets.NEXT_PUBLIC_CALLBACK_AUTH_URL }}

  publish:
    name: Publish ANSEI container
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            environment="production"
          else
            environment="staging"
          fi
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.sha_tag }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.environment }}
          cache-from: type=gha,scope=ansei-app
          cache-to: type=gha,mode=max,scope=ansei-app
          build-args: |
            API_URL=${{ vars.API_URL || secrets.API_URL }}
            NEXT_PUBLIC_SSO_URL=${{ vars.NEXT_PUBLIC_SSO_URL || secrets.NEXT_PUBLIC_SSO_URL }}
            NEXT_PUBLIC_CALLBACK_AUTH_URL=${{ vars.NEXT_PUBLIC_CALLBACK_AUTH_URL || secrets.NEXT_PUBLIC_CALLBACK_AUTH_URL }}
