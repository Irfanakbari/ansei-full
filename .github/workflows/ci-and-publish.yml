name: CI and Docker Publish

on:
  pull_request:
    branches: [master, staging]
  push:
    branches: [master, staging]

permissions:
  contents: read

concurrency:
  group: ansei-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'
  IMAGE_NAME: ansei-app

jobs:
  validate:
    name: Validate ANSEI workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint API
        run: pnpm lint:api

      - name: Test API
        run: pnpm test:api -- --runInBand

      - name: Build API
        run: pnpm build:api

      - name: Lint web
        run: pnpm lint:web

      - name: Build web
        run: pnpm build:web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SSO_URL: ${{ vars.NEXT_PUBLIC_SSO_URL || secrets.NEXT_PUBLIC_SSO_URL }}
          NEXT_PUBLIC_CALLBACK_AUTH_URL: ${{ vars.NEXT_PUBLIC_CALLBACK_AUTH_URL || secrets.NEXT_PUBLIC_CALLBACK_AUTH_URL }}

  publish:
    name: Publish ANSEI container
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            environment="production"
          else
            environment="staging"
          fi
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.sha_tag }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.environment }}
          cache-from: type=gha,scope=ansei-app
          cache-to: type=gha,mode=max,scope=ansei-app
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SSO_URL=${{ vars.NEXT_PUBLIC_SSO_URL || secrets.NEXT_PUBLIC_SSO_URL }}
            NEXT_PUBLIC_CALLBACK_AUTH_URL=${{ vars.NEXT_PUBLIC_CALLBACK_AUTH_URL || secrets.NEXT_PUBLIC_CALLBACK_AUTH_URL }}
